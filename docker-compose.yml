services:
  loadbalancer:
    build: .
    command: ["--config", "/app/configs/config.yaml"]
    ports:
      - "8080:8080"
    volumes:
      - ./configs/${LOADBALANCER_CONFIG:-config.docker.yaml}:/app/configs/config.yaml:ro
    depends_on:
      - backend-1
      - backend-2
      - backend-3
      - backend-4
      - backend-5

  backend-1:
    build: .
    entrypoint: ["demo-backend"]
    environment:
      BACKEND_ID: backend-1
      PORT: "8081"
      RESPONSE_DELAY: 400ms

  backend-2:
    build: .
    entrypoint: ["demo-backend"]
    environment:
      BACKEND_ID: backend-2
      PORT: "8081"
      RESPONSE_DELAY: 200ms

  backend-3:
    build: .
    entrypoint: ["demo-backend"]
    environment:
      BACKEND_ID: backend-3
      PORT: "8081"
      RESPONSE_DELAY: 80ms

  backend-4:
    build: .
    entrypoint: ["demo-backend"]
    environment:
      BACKEND_ID: backend-4
      PORT: "8081"
      RESPONSE_DELAY: 10ms

  backend-5:
    build: .
    entrypoint: ["demo-backend"]
    environment:
      BACKEND_ID: backend-5
      PORT: "8081"
      RESPONSE_DELAY: 50ms
      RESPONSE_DELAY_JITTER: 500ms

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - loadbalancer

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
